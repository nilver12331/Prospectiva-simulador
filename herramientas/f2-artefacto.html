<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Funciones Profesionales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
:root{
  --ground:#f3f4f7; --surface:#ffffff; --surface-2:#f8f9fb; --line:#dfe3ea; --line-2:#eceef3;
  --ink:#16202e; --ink-2:#4a5566; --ink-3:#7a8495;
  --navy:#1d3a6b; --navy-ink:#ffffff; --navy-soft:#e7edf7;
  --gold:#d6a21e; --gold-soft:#fbf3dc; --plum:#6b3fa0; --plum-soft:#f0e9f9;
  --ok:#2f7d4f; --ok-soft:#e3f2e8; --warn:#a86a0c; --warn-soft:#fcefd8; --bad:#b3412f; --bad-soft:#f9e4e0;
  --shadow:0 10px 30px rgba(22,32,46,.12);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0f141c; --surface:#161d28; --surface-2:#1b2330; --line:#2a3444; --line-2:#222b38;
    --ink:#e6eaf1; --ink-2:#b0b9c7; --ink-3:#7f8a9b;
    --navy:#5b86cf; --navy-ink:#0c1320; --navy-soft:#1c2a42;
    --gold:#e2b64a; --gold-soft:#2e2715; --plum:#b492e0; --plum-soft:#251b33;
    --ok:#62b485; --ok-soft:#16301f; --warn:#e0a54a; --warn-soft:#33260f; --bad:#e27a68; --bad-soft:#3a1e1a;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ground:#0f141c; --surface:#161d28; --surface-2:#1b2330; --line:#2a3444; --line-2:#222b38;
  --ink:#e6eaf1; --ink-2:#b0b9c7; --ink-3:#7f8a9b;
  --navy:#5b86cf; --navy-ink:#0c1320; --navy-soft:#1c2a42;
  --gold:#e2b64a; --gold-soft:#2e2715; --plum:#b492e0; --plum-soft:#251b33;
  --ok:#62b485; --ok-soft:#16301f; --warn:#e0a54a; --warn-soft:#33260f; --bad:#e27a68; --bad-soft:#3a1e1a;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;display:flex;flex-direction:column}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* Top bar */
.top{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.01em}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--navy);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:6px 6px auto 6px;height:3px;background:var(--gold);border-radius:2px}
.crumbs{color:var(--ink-3);font-size:13px;display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.crumbs b{color:var(--ink);font-weight:500}
.top .spacer{flex:1}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill.saved{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}

/* Workspace */
.work{flex:1;display:grid;grid-template-columns:minmax(330px,400px) 1fr 290px;min-height:0}
.work.norail{grid-template-columns:minmax(330px,400px) 1fr 0}
.work.expanded,.work.expanded.norail{grid-template-columns:0 1fr 0}
.work.norail .rail,.work.expanded .rail{visibility:hidden;overflow:hidden;border:0}
.work.expanded .chat{visibility:hidden}

/* Chat */
.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--surface)}
.agent-head{padding:14px 18px 10px;display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font-family:var(--serif);font-size:18px;font-weight:600;flex:none;position:relative}
.avatar.live::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.agent-head h1{font-size:15px;margin:0;font-weight:600}
.agent-head p{margin:0;font-size:12px;color:var(--ink-3)}

.stepper{display:flex;gap:4px;padding:0 18px 12px;border-bottom:1px solid var(--line-2)}
.st{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.st span{height:4px;border-radius:2px;background:var(--line)}
.st small{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.st.done span{background:var(--navy)}
.st.now span{background:var(--gold)}
.st.now small{color:var(--ink);font-weight:600}

.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.m{display:flex;gap:10px;max-width:100%}
.m .avatar{width:26px;height:26px;font-size:14px}
.m .body{min-width:0;flex:1}
.m.agent .txt{font-family:var(--serif);font-size:15.5px;line-height:1.55;color:var(--ink)}
.m.agent .txt p{margin:0 0 8px}
.m.agent .txt ul{margin:4px 0 8px;padding-left:18px}
.m.user{justify-content:flex-end}
.m.user .txt{background:var(--navy-soft);padding:9px 13px;border-radius:14px 14px 4px 14px;max-width:85%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip.main{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.chip:hover{border-color:var(--navy)}
.chip:disabled{opacity:.4;cursor:default}
.docref{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:8px;background:var(--surface-2);width:100%;text-align:left}
.docref:hover{border-color:var(--navy)}
.docref .ic{width:30px;height:36px;border-radius:4px;background:var(--surface);border:1px solid var(--line);position:relative;flex:none}
.docref .ic::before{content:"";position:absolute;left:5px;right:5px;top:7px;height:3px;background:var(--gold)}
.docref .ic::after{content:"";position:absolute;left:5px;right:5px;top:14px;height:14px;background:repeating-linear-gradient(var(--line) 0 2px,transparent 2px 5px)}
.docref b{display:block;font-size:13px}
.docref small{color:var(--ink-3);font-size:12px}
.think{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.think div::before{content:"✓ ";color:var(--ok)}
.think div.run::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;border:2px solid var(--gold);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.think div.run::before{animation:none}}

.composer{padding:12px 16px 14px;border-top:1px solid var(--line-2)}
.contbar{padding:10px 16px 0;display:grid;gap:7px}
.contbar .cbig{display:flex;align-items:center;gap:10px;justify-content:flex-start;width:100%;padding:9px 13px;border-radius:11px;text-align:left}
.contbar .cbig .pl{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:11px;flex:none}
.contbar .cbig small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;font-weight:600}
.contbar .cbig b{display:block;font-size:13px;line-height:1.3;white-space:normal;text-wrap:balance}
.contbar .cbig>span:last-child{min-width:0}
.contbar .cbig small{white-space:normal}
.contbar .cbig:disabled{opacity:.5}
.contbar .crow{display:flex;gap:6px}
.contbar .crow select{flex:1;min-width:0;border-radius:8px;padding:5px 8px;background:var(--surface);border:1px solid var(--line);font-size:12px}
.m.agent .txt p.sim{background:var(--surface-2);border-left:3px solid var(--ink-3);border-radius:0 8px 8px 0;padding:8px 11px;font-family:var(--sans);font-size:12.5px;color:var(--ink-2);line-height:1.5}
.box{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:8px 8px 8px 14px;display:flex;gap:8px;align-items:flex-end;box-shadow:0 1px 0 var(--line-2)}
.box textarea{flex:1;border:0;resize:none;background:transparent;outline:none;min-height:22px;max-height:120px;padding:4px 0}
.send{width:32px;height:32px;border-radius:9px;border:0;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;flex:none}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:6px;display:flex;justify-content:space-between;gap:8px}

/* Panel */
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--ground);position:relative}
.p-head{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.p-title{min-width:0;flex:1}
.p-title b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-title small{color:var(--ink-3);font-size:12px}
.tabs{display:flex;gap:2px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;font-size:13px;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.tab:disabled{opacity:.4;cursor:not-allowed}
.tab .n{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.p-body{flex:1;overflow:auto;padding:20px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 24px;max-width:1500px;margin:0 auto}
.sheet h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 2px;color:var(--navy);text-wrap:balance}
.sheet .rule{height:2px;background:var(--gold);margin:8px 0 16px}
.sheet h3{font-size:13px;margin:0 0 10px;color:var(--ink-2);font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1}
.stat{font-size:12px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
.stat b{font-family:var(--mono);font-weight:500;color:var(--ink)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:12px}
th{background:var(--navy);color:var(--navy-ink);font-weight:600;text-align:left;padding:8px 8px;font-size:11px;position:sticky;top:0;z-index:1;vertical-align:bottom}
td{padding:8px;border-top:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
tbody tr:nth-child(even) td{background:var(--surface-2)}
tbody tr:hover td{background:var(--navy-soft)}
td.fn b{color:var(--ink);font-weight:600}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.expanded .clamp{-webkit-line-clamp:unset;display:block}
.more{border:0;background:none;color:var(--navy);font-size:11.5px;padding:2px 0;font-weight:600}
tr.off td{opacity:.45}
tr.off td:last-child{opacity:1}

.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;white-space:nowrap;font-weight:500}
.t-alta{background:var(--ok-soft);color:var(--ok)}
.t-media{background:var(--warn-soft);color:var(--warn)}
.t-baja{background:var(--bad-soft);color:var(--bad)}
.t-neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.t-prop{background:var(--gold-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-rev{background:var(--bad-soft);color:var(--bad)}
.low{color:var(--bad);font-weight:600}

.acts{display:flex;gap:4px}
.ib{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:13px}
.ib:hover{border-color:var(--navy)}
.ib.on-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ib.on-bad{background:var(--bad);border-color:var(--bad);color:#fff}
select.dec{border:1px solid var(--line);border-radius:6px;padding:3px 4px;background:var(--surface);font-size:12px}
.vcheck{display:flex;align-items:center;gap:5px;font-size:11.5px;white-space:nowrap}
.vcheck input{accent-color:var(--ok);width:15px;height:15px}

/* Ficha */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.kv{border:1px solid var(--line-2);border-radius:6px;padding:12px 14px}
.kv .eyebrow{margin-bottom:4px}
.kv p{margin:0;color:var(--ink)}
.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.cap{border-left:3px solid var(--navy);padding:6px 12px;background:var(--surface-2)}
.cap b{font-family:var(--mono);font-size:12px;color:var(--navy)}
.cap p{margin:2px 0 0;font-size:13px;color:var(--ink)}
.empty{border:1px dashed var(--line);border-radius:6px;padding:18px;color:var(--ink-3);margin-top:16px;text-align:center}
.refs{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
.refs li{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line-2);padding:6px 0}
.refs li span:last-child{color:var(--ink)}

/* Drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:5}
.drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer header div{flex:1}
.drawer h4{margin:2px 0 0;font-family:var(--serif);font-size:18px;font-weight:600}
.drawer .db{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.drawer .db p{margin:4px 0 0;color:var(--ink);line-height:1.6}
.drawer textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface-2);min-height:70px}
.drawer footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meter{border:1px solid var(--line-2);border-radius:6px;padding:8px 10px}
.meter b{font-family:var(--mono);font-size:18px;font-weight:500;display:block}

/* Tareas */
.tog{border:0;background:none;color:var(--navy);font-size:11.5px;font-weight:600;padding:3px 0;display:inline-flex;gap:4px;align-items:center}
.tog::before{content:"▸";transition:transform .15s}
td.fn>.tog{align-items:flex-start;text-align:left;width:100%;font-weight:400;color:var(--ink)}
td.fn>.tog b{flex:1;text-align:left;font-weight:600}
td.fn>.tog::before{color:var(--navy);margin-top:1px}
.capficha .ch .dec{margin-left:auto}
.ident{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.ident .full{grid-column:1/-1}
.ident .il{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:2px}
.ident b{font-size:13px;color:var(--ink)}
.ident p{margin:0;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
@media (max-width:760px){.ident{grid-template-columns:1fr}}
.infob{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:17px;height:17px;padding:0;font-size:11px;font-weight:700;color:var(--navy);line-height:1;display:inline-grid;place-items:center;vertical-align:middle;margin-left:5px}
.infob:hover{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
th .infob{border-color:rgba(255,255,255,.45);background:transparent;color:#fff}
th .infob:hover{background:#fff;color:var(--navy)}
.ayhero{display:flex;gap:14px;align-items:center;margin:-14px -18px 14px;padding:16px 18px;border-bottom:1px solid var(--line)}
.ayhero .ayic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:19px;font-weight:700;flex:none;color:#fff}
.ayhero b{display:block;font-family:var(--serif);font-size:17px;color:var(--ink)}
.ayhero small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.ay-navy{background:linear-gradient(120deg,var(--navy-soft),transparent)} .ay-navy .ayic{background:var(--navy)}
.ay-gold{background:linear-gradient(120deg,var(--gold-soft),transparent)} .ay-gold .ayic{background:var(--gold);color:#3a2d05}
.ay-ok{background:linear-gradient(120deg,var(--ok-soft),transparent)} .ay-ok .ayic{background:var(--ok)}
.ay-bad{background:linear-gradient(120deg,var(--bad-soft),transparent)} .ay-bad .ayic{background:var(--bad)}
.mbody .q{font-size:13.5px;color:var(--ink);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin:0 0 10px}
.mbody .q b{color:var(--navy)}
.mbody .analog{background:var(--gold-soft);border-left:5px solid var(--gold);padding:11px 13px;border-radius:0 8px 8px 0;margin:10px 0 4px;font-size:13px;line-height:1.6}
.mbody .analog b:first-child{color:var(--warn)}
.mbody .ko{background:var(--bad-soft);border-left:5px solid var(--bad);padding:11px 13px;border-radius:0 8px 8px 0;margin:10px 0 4px;font-size:13px}
.mbody .si{background:var(--ok-soft);border-left:5px solid var(--ok);padding:11px 13px;border-radius:0 8px 8px 0;margin:10px 0 4px;font-size:13px}
.mbody .si b:first-child{color:var(--ok)}
.mbody .ko b:first-child{color:var(--bad)}
.mbody .nv{background:var(--navy-soft);border-left:5px solid var(--navy);padding:11px 13px;border-radius:0 8px 8px 0;margin:10px 0 4px;font-size:13px}
.mbody .nv b:first-child{color:var(--navy)}
.lectura{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:12px}
.lec{border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;border-left:4px solid var(--q)}
.lec b{display:block;font-size:13px;color:var(--ink)}
.lec .cch{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:#b57d04;color:#fff;border-radius:4px;padding:1px 6px;vertical-align:middle;margin-left:4px}
.lec small{display:block;font-size:11.5px;color:var(--ink-3);margin:2px 0 6px}
.lec p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:4px 0 6px}
.blkc{border-radius:14px;padding:18px 20px;color:#fff;position:relative;overflow:hidden}
.blkc.fun{background:linear-gradient(135deg,var(--navy),#0e1d38)}
.blkc .ic{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;margin-bottom:10px}

evidencia se consolidan como apoyo a la decisión clínica [26]. Por eso es necesario que el egresado domine la práctica basada en evidencia.", "dec": "Fortalecer", "obs": "I-CVI 1,00 · CVR 1,00 · Prioridad 12 · Suficiencia: S. La investigación se reasigna a C6.", "refs": "[3] [4] [6] [13] [26] [28] [29]", "prod": {"name": "Sustento de evidencia de la decisión clínica", "desc": "Referencia explícita a la guía o evidencia que respalda una decisión nutricional, incorporada en la nota clínica del caso para asegurar una práctica segura y vigente. Consigna la recomendación aplicada, su fuente y su vigencia; en los casos complejos o con evidencia contradictoria, añade la pregunta clínica y la valoración de la evidencia. Se construye con guías de práctica clínica vigentes y, en casos complejos, con el formato PICO y búsquedas en bases de datos; se verifica con la vigencia de la guía citada y, cuando corresponde, con AGREE II y GRADE. Respalda la conducta ante un caso concreto y demuestra el dominio de la práctica basada en evidencia.", "ents": [{"n": "1", "t": "Decisión sustentada (entregable único)", "codes": "B12a-T1, B12a-T2, B12a-T3", "sum": "evidencia que respalda las decisiones de los demás productos.", "ev": ["Cita de la guía o evidencia incorporada en la nota clínica de cada producto de la competencia.", "Análisis PICO con valoración AGREE II o GRADE en un número limitado de casos complejos por rotación (p. ej., dos)."]}]}, "dic": {"ev": "E2 (ICDA, MOF, GPC EsSalud) · estándar ACEND", "tend": "E6 (GLIM 2025; EAL)", "d": "S", "acc": "—"}}, "B11a": {"c": "B11a", "t": "Aplicación de protocolos e indicadores de calidad", "d": "Aplica los protocolos de atención nutricional del servicio y registra sus indicadores de calidad y seguridad para contribuir a la mejora continua.", "capm": "Transversal (C1.1–C1.4)", "tipo": "Transversal", "conf": 4, "lim": "No modifica protocolos ni aprueba planes correctivos: escala las desviaciones a la jefatura o al comité de calidad", "icvi": "1,00", "cvr": "1,00", "pr": "9", "suf": "S", "tasks": [{"code": "B11a-T1", "t": "Aplicar la lista de verificación del protocolo de atención nutricional del servicio", "ent": "1. Reporte de calidad (entregable único)"}, {"code": "B11a-T2", "t": "Registrar los indicadores de calidad y seguridad del servicio", "ent": "1. Reporte de calidad (entregable único)"}, {"code": "B11a-T3", "t": "Reportar las desviaciones priorizadas a la jefatura o al comité de calidad", "ent": "1. Reporte de calidad (entregable único)"}], "rec": [{"cat": "Estándares", "code": "RH-E14", "t": "Sistema de Gestión de la Calidad en Salud (RM 519-2006/MINSA)", "apl": "Marco nacional para la medición de indicadores y la mejora continua.", "tareas": "B11a-T2, B11a-T3", "dom": "Conoce", "ap": "Entregable único: Reporte de calidad — facilita el tablero de indicadores — mejora la gestión de la calidad.", "ref": "[22]"}, {"cat": "Estándares", "code": "RH-E15", "t": "Directiva de rondas de seguridad del paciente (RM 163-2020/MINSA)", "apl": "Establece la verificación periódica de prácticas seguras.", "tareas": "B11a-T1", "dom": "Aplica", "ap": "Entregable único — facilita la lista de verificación del protocolo — mejora la seguridad.", "ref": "[23]"}, {"cat": "Estándares", "code": "RH-E08", "t": "NTS N.° 103-MINSA/DGSP-V.01, UPSS de Nutrición y Dietética (RM 665-2013/MINSA)", "apl": "Define los procesos del servicio que los protocolos deben cumplir.", "tareas": "B11a-T1", "dom": "Aplica", "ap": "Entregable único — facilita la verificación del cumplimiento — mejora la conformidad normativa.", "ref": "[15]"}, {"cat": "Metodologías", "code": "RH-M15", "t": "Ciclo Planificar-Hacer-Estudiar-Actuar (PDSA)", "apl": "Método de mejora continua en ciclos cortos con medición.", "tareas": "B11a-T3", "dom": "Aplica", "ap": "Entregable único — facilita el reporte de desviaciones priorizadas — mejora la acción correctiva.", "ref": "[38]"}, {"cat": "Metodologías", "code": "RH-M16", "t": "Auditoría de cumplimiento con lis rsal)", "cap": "Transversal (C1.1–C1.4)", "dem": "Media", "fd": "Esta función tiene demanda porque los servicios de salud deben demostrar calidad y seguridad. La Ley 30188 (art. 5) incluye funciones del nutricionista en la gestión de los servicios [2]; el Sistema de Gestión de la Calidad en Salud, aprobado por la RM 519-2006/MINSA, obliga a medir indicadores [25]; y el estándar ICDA incluye la mejora de la calidad [6]. Ello exige profesionales capaces de aplicar protocolos y registrar indicadores.", "imp": "Alto", "ji": "En los próximos 5 años, esta función tendrá impacto porque el MINSA mantiene la acreditación de establecimientos de salud y servicios médicos de apoyo [35] y sigue otorgándola mediante resoluciones ministeriales [36]. Ese proceso exige evidencias de cumplimiento en cada servicio. Por eso es necesario que el egresado domine la gestión de la calidad operativa.", "dec": "Fortalecer", "obs": "I-CVI 1,00 · CVR 1,00 · Prioridad 9 · Suficiencia: S. Elaborar protocolos queda para la jefatura.", "refs": "[2] [6] [25] [35] [36]", "prod": {"name": "Reporte de cumplimiento de protocolos clínicos e indicadores de calidad", "desc": "Informe periódico sobre la aplicación de los protocolos clínico-nutricionales del servicio, que detecta desvíos y contribuye a la mejora continua. Reúne la verificación del cumplimiento, los indicadores y las desviaciones priorizadas; los indicadores de inocuidad corresponden a N4 (C3). Se elabora con listas de verificación y registros del servicio, y se contrasta con las metas del servicio y con el Sistema de Gestión de la Calidad en Salud. Sirve a la jefatura o al comité de calidad para decidir acciones correctivas, y demuestra el dominio de la calidad operativa.", "ents": [{"n": "1", "t": "Reporte de calidad (entregable único)", "codes": "B11a-T1, B11a-T2, B11a-T3", "sum": "cumplimiento de los protocolos y su análisis.", "ev": ["Lista de verificación del protocolo aplicada.", "Tablero de indicadores (p. ej., porcentaje de pacientes tamizados en 48 horas).", "Reporte de desviaciones priorizadas elevado a la jefatura o al comité de calidad."]}]}, "dic": {"ev": "E1 (Ley 30188; RM 519-2006) · E2 (ICDA)", "tend": "E6 (acreditación MINSA vigente)", "d": "S", "acc": "Citar el número y los estándares de la norma técnica de acreditación vigente"}}, "B06-C1": {"c": "B06-C1", "t": "Especificación de regímenes y control de bandejas", "d": "Especifica los regímenes dietoterapéuticos y sus texturas y verifica que cada bandeja corresponda a la prescripción del paciente.", "capm": "C1.3 Intervenir (compartida con C3.2 Operar)", "tipo": "Actual", "conf": 3, "lim": "No asume la planificación de menús, la producción ni la inocuidad microbiológica (C3 y jefatura de dietética)", "icvi": "1,00", "cvr": "1,00", "pr": "16", "suf": "S", "tasks": [{"code": "B06-C1-T1", "t": "Aplicar y actualizar las especificaciones nutricionales y de textura de los regímenes según el manual vigente del servicio", "ent": "1. Especificación y control de regímenes (entregable único)"}, {"code": "B06-C1-T2", "t": "Verificar diariamente la correspondencia entre la bandeja y la prescripción", "ent": "1. Especificación y control de regímenes (entregable único)"}, {"code": "B06-C1-T3", "t": "Registrar las incidencias de aceptación de las dietas", "ent": "1. Especificación y control de regímenes (entregable único)"}], "rec": [{"cat": "Estándares", "code": "RH-E08", "t": "NTS N.° 103-MINSA/DGSP-V.01, UPSS de Nutrición y Dietética (RM 665-2013/MINSA)", "apl": "Regula la organización del servicio y la atención de regímenes dietéticos.", "tareas": "B06-C1-T1", "dom": "Aplica", "ap": "Entregable único: Especificación y control de regímenes — facilita la sección del manual de regímenes — mejora la conformidad.", "ref": "[15]"}, {"cat": "Estándares", "code": "RH-E27", "t": "Norma sanitaria para los servicios de alimentación en establecimientos de salud (RM 749-2012/MINSA)", "apl": "Establece las condiciones sanitarias de preparación y distribución de alimentos a pacientes.", "tareas": "B06-C1-T2", "dom": "Aplica", "ap": "Entregable único — facilita el control de bandejas — mejora la inocuidad y la seguridad alimentaria.", "ref": "[39]"}, {"cat": "Estándares", "code": "RH-E07", "t": "IDDSI Framework y sus métodos de prueba", "apl": "Define los niveles de textura y las pruebas de flujo y de tenedor para verificarlos.", "tareas": "B06-C1-T1, B06-C1-T2", "dom": "Domina", "ap": "Entregable único — facilita las especificaciones de textura y su verificación — mejora la seguridad en disfagia.", "ref": "[14]"}, {"cat": "Estándares", "code": "RH-E09", "t": "Tablas peruanas de composición de alimentos (INS–CENAN, 2017)", "apl": "Base oficial para especificar el aporte nutricional de los regímenes.", "tareas": "B06-C1-T1", "dom": "Aplica", "ap": "Entregable único — facilita las especificaciones nutricionales — mejora la exactitud.", "ref": "[16]"}, {"cat": "Metodologías", "code": "RH-M17", "t": "Control diario de correspondencia bandeja-prescripción por muestreo", "apl": "Verificación de una muestra de bandejas contra las órdenes de dieta con lista de verificación.", "tareas": "B06-C1-T2, B06-C1-T3", "dom": "Aplica", "ap": "Entregable único — facilita la lista de verificación y el porcentaje de correspondencia — mejora la detección de errores.", "ref": "[15]"}, {"cat": "Herramientas y tecnologías", "code": "RH-T16", "t": "Sistema de órdenes de dieta (sistema institucional)", "apl": "Transmite las prescripciones a dietética y genera la lista de bandejas.", "tareas": "B06-C1-T2, B06-C1-T3", "dom": "Aplica", "ap": "Entregable único — facilita la verificación de correspondencia — mejora la trazabilidad.", "ref": "[15]"}, {"cat": "Herramientas y tecnologías", "code": "RH-T17", "t": "Kit de pruebas IDDSI (equipo técnico)", "apl": "Jeringa de 10 ml y tenedor para las pruebas de flujo y de textura.", "tareas": "B06-C1-T2", "dom": "Aplica", "ap": "Entregable único — facilita la verificación de texturas — mejora la seguridad.", "ref": "[14]"}, {"cat": "Integración de IA generativa", "code": "RH-IA09", "t": "Generación asistida de fichas de especificación de regímenes", "apl": "▪ Tarea: Actualizar la sección del manual de regímenes\n▪ Autonomía: A2 · Coproducción: la IA propone; el profesional verifica, corrige y firma (nivel de confianza de la función: 3)\n▪ Herramienta: Modelo de lenguaje de uso general\n▪ Datos permitidos: Solo características de los regímenes del servicio; ningún dato de pacientes\n▪ Verificación: Contra el manual vigente, el IDDSI y las Tablas peruanas; verifica y firma el nutricionista\n▪ Evidencia: registro de instrucciones, tabla de verificación y declaración de uso\n▪ Competencia en IA (UNESCO): Aplicar", "tareas": "B06-C1-T1", "dom": "Aplica", "ap": "Entregable único — fichas homogéneas y actualizadas en menos tiempo · Relevancia: Complementario", "ref": "[9] [10] [11] [12]"}], "cap": "C1.3 Intervenir (compartida con C3.2 Operar)", "dem": "Alta", "fd": "Esta función tiene demanda porque cada hospital produce diariamente dietas terapéuticas. La NTS N.° 103-MINSA/DGSP-V.01, aprobada por la RM 749-2012/MINSA, regula la unidad productora de servicios de nutrición y dietética [22][23]. Los MOF de Cusco y Huacho organizan esa área [3][4], y la función aparece en 4 de los 15 avisos revisados [8]. Ello exige profesionales capaces de especificar los regímenes y controlar su entrega.", "imp": "Medio", "ji": "En los próximos 5 años, esta función tendrá impacto porque los hospitales contratan cada vez más la alimentación a concesionarios: el Hospital Santa Rosa licitó en 2024 un servicio para pacientes y personal por S/ 7,5 millones [34]. En estos contratos, el nutricionista del establecimiento conserva la prescripción y valida las dietas cada día [33]. Por eso es necesario que el egresado domine la especificación y el control de los regímenes.", "dec": "Fortalecer", "obs": "I-CVI 1,00 · CVR 1,00 · Prioridad 16 · Suficiencia: S. La producción se forma en C3.", "refs": "[3] [4] [  {s:4,  f:()=>{ if(!S.recPanel) return loadRes(); active().forEach(f=>f.rs.forEach(r=>{ if(r.st==="prop"||r.st==="rev") r.st="ok"; })); refresh(); checkRes22(); }},

const accionLabel = () => { const n=S.step;

  if(n===4) return !S.recPanel ? "Cargar la validación abreviada" : "Confirmar los elementos de las 12 funciones";

function avanzar(){
  if(S.busy){ toast("Génesys está trabajando · un segundo"); return; }
  if(S.step>=23){ toast("La Fase 2 ya está completa"); return; }
  const p = FLUJO.find(x=>x.s===S.step) || FLUJO.find(x=>x.s>S.step);
  if(!p){ saltar(); return; }
  S.step = p.s;
  try { p.f(); } catch(err){ console.warn(err); toast("Momento simulado: "+String(err.message||err).slice(0,60)); saltar(); }
  setTimeout(()=>{ if(!S.busy && S.step===p.s) { /* la acción no movió el estado */ } }, 50);
}
function saltar(n){
  if(S.busy){ toast("Génesys está terminando el momento · se salta enseguida"); setTimeout(()=>saltar(n), 700); return; }
  const t = Math.min(23, (n===undefined? S.step+1 : n));
  forzarEstado(t);
  addMsg("agent", `<p class="sim">Momento <b>${esc(momLabel(t===0?0:t-1))}</b> dado por conforme para no interrumpir la demostración. El resultado que ve es el que produciría la ejecución real; queda marcado como <b>simulado</b> en la bitácora.</p>`);

/* Arma el estado completo de un momento cualquiera, sin recorrer los anteriores */
function forzarEstado(n){
  if(!S.spec){ S.spec = ESP_C1; }
  if(n>=1){
    if(!S.fn.length){ S.fn = FNK.map(k=>({...D.FN[k], fb:"ok", sb:"ok", pb:"ok", rs:[]})); S.fn.forEach(f=>f.dec=decOf(f)); }
    S.delphi = true; S.round = 2; S.avail.add("paquete"); S.avail.add("ficha");
  }
  if(n>=2){ S.excl.forEach(x=>{ if(x.st!=="ok") x.st="ok"; }); S.exclOk = true; }
  if(n>=3){ S.saved.p21 = true; S.avail.add("informe"); }
  if(n>=4){ S.recOn = true; S.avail.add("recursos");
    S.fn.forEach(f=>{ if(!f.rs || !f.rs.length) f.rs = (f.rec||[]).map((r,i)=>({...r, id:`${f.c}#${i}`, st: r.code==="—"?"na":"ok"})); });
    if(active().length) S.recSel = active()[0].c; }
  if(n>=5){ S.recPanel = true; active().forEach(f=>f.rs.forEach(r=>{ if(r.st==="prop"||r.st==="rev") r.st="ok"; })); resPrompted = true; }
  if(n>=6){ S.te.gen = true; S.te.show = true; }
  if(n>=7){ S.saved.p22 = true; S.te.saved = true; }
  if(n>=8){ S.bulk.fn = true; S.bulk.rec = true; S.d23.lote = true; S.avail.add("disc"); }
  if(n>=9){ S.d23.temas = true; }
  if(n>=10){ S.d23.dim = true; S.d23.DIM.forEach(d=>{ S.d23.dopen[d[0]] = true; }); }
  if(n>=11){ S.d23.comp = true; S.d23.huerf = "baja"; }
  if(n>=12){ S.d23.panel = true; S.d23.ronda = 2; }
  if(n>=13){ S.d23.saved = true; }
  if(n>=14){ S.d24.gen = true; S.avail.add("pesos"); }
  if(n>=15){ S.d24.ind = true; }
  if(n>=16){ S.d24.panel = true; S.d24.pesos = true; }
  if(n>=17){ S.d24.corte = true; try{ calc24(); }catch(e){} }
  if(n>=18){ S.d24.saved = true; }
  if(n>=19){ S.d25.gen = true; S.avail.add("cursos"); }
  if(n>=20){ S.d25.coh = true; S.d25.form = true; }
  if(n>=22){ S.d25.panel = true; }
  if(n>=23){ S.d25.saved = true; }
  S.step = n;
  const v = STEPVIEW[Math.min(n, STEPVIEW.length-1)];
  if(v && S.avail.has(v[0])){ if(v[1]) S.mode[v[0]] = v[1]; setTab(v[0]); }

}

  const ks = c[0][0]==="C" && +c[0][1]>=4 ? [] : ESC.filter(e=>e.c===c[0]).map(e=>e.k);

    if(["1.1","1.2","1.3","1.4","1.5","1.6","2.1","2.2","2.3"].includes(paso)) return "na";
    if(paso==="2.4") return S.d23.saved?"ok":S.d23.comp?"espera":"curso";
    if(paso==="2.5") return S.d24.saved?"ok":S.d24.gen?"curso":"nada";
    if(paso==="2.6") return S.d25.saved?"ok":S.d25.gen?"curso":"nada";

function decide31(v){

function cohDe(t){

  if(n===1) return ["ok","Derivación suficiente","Un solo tema de especialidad lo exige, pero la relación es de fundamento y el nivel declarado es coherente con el de ese tema."];

    <div class="analog"><b>Ejemplo.</b> Si una especialidad es 5.ª por peso pero 3.ª por IPC, el mercado la pide más de lo que la formación obligatoria le da: candidata natural a <b>itinerario electivo</b> o a certificación progresiva, no a más créditos obligatorios.</div>`],
 CRED:["Créditos obligatorios de la especialidad",
   `<p>Es su porcentaje de distribución aplicado a la bolsa obligatoria: <b>Créditos(e) = OBLIG × Distribución(e) ÷ 100</b>, en enteros por restos mayores para que la suma cuadre exactamente.</p>
    <p>Son los créditos que <b>todo egresado cursa</b> de esa especialidad, aparte del bloque de fundamento y de los electivos.</p>`],
 FUND:["fund(e) · la fracción de fundamento",
   `<p>De todo lo que una especialidad exige saber, <b>¿qué parte es saber compartido con otras especialidades?</b> Eso es fund(e).</p>
    <p><b>fund(e) = temas de fundamento que exige ÷ total de sus temas nucleares.</b> Un tema es «de fundamento» cuando lo exigen dos o más especialidades; si lo exige una sola, se queda en ella.</p>
    <div class="analog"><b>Ejemplo.</b> Nutrición comunitaria tiene fund(e) alto: casi todo lo que necesita —composición de alimentos, bioestadística, epidemiología— lo comparte con otras. Desarrollo de productos lo tiene bajo: buena parte de su saber (evaluación sensorial, vida útil) no lo usa nadie más.</div>
    <p class="mini">De esto sale cuánto del plan es tronco común: una carrera cuyas especialidades comparten mucho necesita un tronco grande.</p>`],
 CORTE:["¿Cuánto del plan es fundamento y cuánto es especialidad?",
   `<p>El plan tiene una bolsa de créditos específicos. Hay que partirla en dos: los cursos de <b>fundamento</b> que todos llevan, y los de <b>especialidad</b>.</p>
    <p>Esa partición <b>no se decide por política, se deriva</b> de lo que las especialidades exigen: se promedia el fund(e) de cada una, pesándolo por cuánto pesa la especialidad en el plan. Una especialidad que se lleva el 30 % del plan pesa 30 % en la decisión del tronco; una del 8 %, mucho menos.</p>
    <div class="analog"><b>Analogía.</b> Si seis cocineros comparten el 40 % de sus ingredientes, la despensa común será del 40 %: no porque alguien lo decida, sino porque eso es lo que comparten. La banda corporativa solo avisa si el resultado es implausible.</div>`],
 PESOPLAN:["Peso de la especialidad en el plan",
   `<p class="q"><b>Qué es:</b> el porcentaje de la formación de especialidad que le toca a esta especialidad, según cuánta formación exige comparada con las demás.</p>
    <p>Es la columna <b>Distribución</b> del peso formativo, la misma con que se reparten los créditos obligatorios. Las seis suman 100 %.</p>
    <div class="analog"><b>Para qué se usa aquí.</b> Para que la especialidad que se lleva más plan también mande más en la decisión del tronco común. Si una especialidad ocupa el 30 % del plan y comparte poco con las demás, empuja el tronco hacia abajo con fuerza; si la que comparte poco ocupa solo el 8 %, casi no lo mueve.</div>`],
 APORTE:["Cuánto aporta al tronco común",
   `<p class="q"><b>Qué es:</b> peso en el plan × saber compartido. Es el trozo del tronco que esta especialidad justifica.</p>
    <div class="analog"><b>Ejemplo.</b> Nutrición clínica y pediátrica pesa 30 % del plan y comparte el 35 % de su saber: aporta 10,5 puntos. Nutrición deportiva pesa 10,5 % y comparte 35 %: aporta 3,7. Mismo porcentaje de saber compartido, pero una pesa tres veces más en el plan y por eso manda tres veces más.</div>
    <p>La suma de todos los aportes es el <b>tamaño del tronco común</b>: el porcentaje de los créditos específicos que se dedica a fundamento.</p>`],
 BANDA:["La banda corporativa · para qué sirve",
   `<p class="q"><b>Qué es:</b> el rango de tronco común que la universidad considera razonable para cualquier carrera, fijado por política institucional. Aquí es 30 % a 45 %.</p>
    <p><b>No decide: vigila.</b> El tamaño del tronco lo decide lo que las especialidades comparten. La banda solo avisa cuando el resultado es implausible y hay que mirar dos veces.</p>
    <div class="si"><b>Dentro de banda.</b> El paso continúa sin más trámite. Es lo normal: una carrera con especialidades parientes entre sí cae naturalmente ahí.</div>
    <div class="ko"><b>Fuera de banda.</b> El paso se detiene y ofrece dos salidas, nunca el ajuste a mano: subir el <b>umbral de compartición</b> del paso 2.4 y volver a correr la derivación —un tronco inflado casi siempre viene de un umbral demasiado bajo—, o <b>declarar la excepción</b> con su evidencia ante la Dirección.</div>
    <div class="analog"><b>Cómo leerla.</b> Por debajo del 30 %, la carrera se parece a seis carreras distintas pegadas: el egresado no tendría base común. Por encima del 45 %, casi todo es tronco y las especialidades se quedan sin horas para lo suyo: el título diría mucho y el egresado sabría hacer poco.</div>`],
 PD:["PD · peso de la dimensión",
   `<p class="q"><b>Qué es:</b> cuánto reclaman las especialidades a esta dimensión, pesando a cada una por lo que pesa en el plan.</p>
    <p>Para cada especialidad se mira qué parte de su fundamento cae en esta dimensión, y se multiplica por su peso en el plan. La suma es el PD. Llevado a porcentaje da la <b>distribución</b>, y esa distribución reparte los créditos del bloque de fundamento.</p>
    <div class="analog"><b>Ejemplo.</b> Todas las especialidades exigen composición y análisis de alimentos, así que «Ciencia de los alimentos» acumula PD alto y se lleva más créditos. «Evaluación y medición» la exigen cuatro, y de esas cuatro no todas le dedican la misma parte de su fundamento: acumula menos.</div>
    <p class="mini">Cotas: piso 4 créditos y techo 35 % del bloque. Una dimensión bajo el piso <b>no se sube: se disuelve</b>, porque una dimensión sin masa crítica no es una dimensión.</p>`],
 MAPA:["Cómo se lee el mapa",
   `<p class="q"><b>Dos preguntas distintas, un solo gráfico:</b> hacia la derecha, cuánta formación exige la especialidad; hacia arriba, cuánto la pide el mercado.</p>
    <div class="si"><b>Arriba a la derecha · núcleo de la carrera.</b> Exige mucha formación y el mercado la pide: cursos obligatorios y práctica extensa. Es donde va el grueso del plan.</div>
    <div class="analog"><b>Arriba a la izquierda · oportunidad para certificar.</b> El mercado la pide más de lo que su complejidad justifica en créditos obligatorios. Se atiende con <b>itinerario electivo</b> o certificación corta, no con más obligatorios.</div>
    <div class="nv"><b>Abajo a la derecha · formación costosa de baja demanda.</b> Cuesta mucho formar y el mercado la pide poco. Se mantiene lo indispensable y se evalúa si en realidad es un ámbito de otra especialidad.</div>
    <div class="ko"><b>Abajo a la izquierda · candidata a salir.</b> Ni exige ni se pide. Se revisa en el paso 1.1 del próximo ciclo.</div>
    <p class="mini">El eje vertical no entra en el reparto de créditos: está ahí para que la decisión se tome con los dos datos a la vista.</p>`],
 TEEX:["Temas de especialidad que lo exigen",
   `<p class="q"><b>Qué es:</b> los temas nucleares que el paso 2.3 extrajo del trabajo real de la especialidad —lo que la tarea exige saber— y que <b>invocan</b> este tema base.</p>
    <div class="analog"><b>Por qué están aquí.</b> El conocimiento se obtiene en dos eslabones: primero el saber que la tarea usa, después el saber que ese saber exige antes. Si un tema base no tiene ningún tema de especialidad a su izquierda, no se derivó de nada: o falta un tema en el 2.3, o el tema base sobra.</div>
    <div class="si"><b>Ejemplo.</b> «Punto de equilibrio» es tema de especialidad; «ecuaciones de primer grado» es su tema base. Ninguna hoja de costeo nombra las ecuaciones, pero sin ellas el punto de equilibrio no se entiende.</div>`],
 COHE:["Coherencia de derivación",
   `<p class="q"><b>Qué es:</b> el dictamen de los agentes expertos sobre si este tema base es <b>realmente</b> el saber previo de los temas de especialidad que lo invocan.</p>
    <div class="si"><b>Derivación verificada.</b> Dos o más temas de especialidad lo exigen y la relación es de fundamento, no de equivalencia.</div>
    <div class="nv"><b>Deriva de otras especialidades.</b> Esta especialidad no lo exige; lo sostienen otras y lo evalúan sus subpaneles.</div>
    <div class="ko"><b>Para revisar.</b> El enlace es débil o no existe. Se corrige en el 2.3 agregando el tema que falta, o se retira el tema base.</div>`],
 ANCL:["Nivel de anclaje",
   `<p class="q"><b>Qué es:</b> dónde se necesita ese saber. El barrido recorre <b>producto → entregable → tarea</b> y ancla cada tema al nivel <b>más fino</b> en que hace falta.</p>
    <div class="analog"><b>Por qué importa.</b> Los saberes más específicos viven a nivel de tarea. Un barrido que solo mire productos produce un tronco plausible pero incompleto, y el vacío se descubre cuando el estudiante no puede resolver el caso.</div>
    <div class="si"><b>Ejemplo.</b> El producto <i>Expediente de evaluación</i> exige fisiopatología para interpretar el conjunto; el entregable <i>Diagnóstico</i> exige criterios diagnósticos; y la tarea <i>revisar la interacción fármaco-nutriente</i> exige farmacología básica, un saber que no aparece si solo se mira el producto.</div>`],
 NMIN:["Nivel mínimo compartido",
   `<p class="q"><b>Qué es:</b> el nivel al que el <b>tronco común</b> enseña el tema: el más bajo de los que exigen las especialidades que lo comparten.</p>
    <p>Cada especialidad exige el tema a un nivel —Conoce, Aplica o Domina—, que sale del nivel de dominio de los elementos de productividad que lo originan.</p>
    <div class="analog"><b>Ejemplo.</b> Si clínica exige <i>Domina</i> en antropometría y comunitaria solo <i>Aplica</i>, el tronco enseña <b>Aplica</b>, y el salto a <i>Domina</i> se queda como tema de especialidad de clínica. Así un umbral bajo no infla el tronco por la vía de la profundidad.</div>`],
 CLAS:["Clasificación del tema",
   `<p class="q"><b>La regla:</b> un tema es <b>de fundamento</b> cuando lo exigen dos o más especialidades —el umbral de compartición—; si lo exige una sola, es <b>de especialidad</b> y se queda en ella.</p>
    <div class="si"><b>De fundamento.</b> Va a una dimensión del dominio disciplinar. Se enseña <b>una sola vez</b>, al nivel mínimo compartido, para todos los egresados.</div>
    <div class="analog"><b>De especialidad.</b> No desaparece: entra en la estructura de conocimiento de su especialidad, en el paso 3.2.</div>
    <div class="ko"><b>Huérfano.</b> Superó el umbral pero no encaja en ninguna dimensión. Va al panel; si no lo ubican, baja a tema de especialidad de la que más lo exige, y se declara.</div>`],
 COOC:["Índice de co-ocurrencia",
   `<p class="q"><b>Qué responde:</b> ¿qué temas conviene enseñar juntos? El algoritmo mide cuánto se parecen dos temas por tres señales.</p>
    <p><b>50 % especialidades en común</b> — si los exigen las mismas especialidades, sirven al mismo propósito. <b>30 % artefactos de anclaje en común</b> — si se necesitan para el mismo producto o la misma tarea, se usan juntos. <b>20 % mismo objeto de conocimiento</b>, que juzga el agente: 1,0 mismo objeto, 0,5 objetos vecinos, 0 sin relación.</p>
    <p>Con esas distancias se agrupa por enlace promedio y se corta en el <b>60 %</b>. El algoritmo propone; el panel decide.</p>
    <div class="analog"><b>Ejemplo.</b> Antropometría y bioestadística las exigen casi las mismas especialidades y se anclan a los mismos informes: co-ocurrencia alta, misma dimensión. Antropometría e inocuidad no comparten ni especialidades ni artefactos: quedan separadas.</div>`],
 OBJ:["Prueba del objeto",
   `<p class="q"><b>La pregunta:</b> ¿los temas de esta agrupación actúan sobre el <b>mismo objeto de conocimiento</b>?</p>
    <p>Es el filtro cualitativo que va después del algoritmo. Dos temas pueden co-ocurrir mucho por estadística y aun así ser cosas distintas.</p>
    <div class="si"><b>Pasa.</b> Composición de alimentos, procesamiento e inocuidad: todos actúan sobre <b>el alimento</b>.</div>
    <div class="ko"><b>No pasa.</b> Epidemiología y comunicación del cambio co-ocurren porque las exige la misma especialidad, pero una estudia poblaciones y la otra conductas: si se juntan sin más, la dimensión no tiene objeto.</div>`],
 NOMB:["Prueba de nombrabilidad",
   `<p class="q"><b>La pregunta:</b> ¿la dimensión admite un nombre que un docente reconocería como <b>algo que se enseña</b>?</p>
    <p>Si no lo admite, no es una dimensión: es una coincidencia estadística. Y el nombre <b>no puede llevar dentro el nombre de una especialidad</b>.</p>
    <div class="si"><b>Pasa.</b> «Bioquímica y metabolismo nutricional»: nombra un cuerpo de saber.</div>
    <div class="ko"><b>No pasa.</b> «Fundamentos para la nutrición clínica»: nombra a quién sirve, no qué es. Tampoco pasa un nombre que junta dos objetos, como «Salud pública, política y comportamiento» en su primera versión.</div>`],
 CERT:["¿Conviene certificarla?",
   `<p class="q"><b>Qué responde:</b> si a esta especialidad le conviene una <b>certificación progresiva</b> o un itinerario electivo, en lugar de más créditos obligatorios.</p>
    <div class="si"><b>Sí · prioritaria.</b> El mercado la pide más de lo que su complejidad justifica en el plan obligatorio. Certificarla da señal de empleabilidad sin inflar el plan: el estudiante que quiera profundizar lo hace por el itinerario.</div>
    <div class="analog"><b>Opcional.</b> Ya es núcleo de la carrera: todo egresado la lleva. La certificación solo agrega una credencial visible sobre algo que de todos modos se forma.</div>
    <div class="ko"><b>No conviene.</b> Formación costosa que el mercado pide poco, o especialidad que ni exige ni se demanda: certificarla no crea demanda que no existe.</div>
    <p class="mini">El paso 4.4 formaliza las certificaciones; aquí solo se marca la recomendación con los dos ejes a la vista.</p>`],
 HITO:["Hito de progresión · N1, N2, N3",
   `<p class="q"><b>Qué es:</b> hasta dónde lleva el curso al estudiante en esa función. No es dificultad: es <b>autonomía</b>.</p>
    <div class="analog"><b>N1 · Fundamentos.</b> Reconoce, explica y ejecuta con guía paso a paso. El estudiante sabe qué se hace y por qué, pero todavía no decide.</div>
    <div class="si"><b>N2 · Funcional.</b> Ejecuta la función completa en condiciones habituales, con supervisión disponible. Es el nivel de la mayoría de los cursos obligatorios de especialidad.</div>
    <div class="nv"><b>N3 · Dominio autónomo.</b> Resuelve casos no rutinarios sin supervisión y responde por el resultado. Es el nivel de los <b>electivos avanzados</b> y de la práctica preprofesional; un electivo con hito N1 o N2 está mal formulado.</div>
    <p class="mini">El hito se deriva del <b>EPA</b> de las funciones que el curso tributa —el nivel de confianza que el panel de expertos les puso en el 2.1— y de ahí sale también el porcentaje de práctica del curso.</p>`],
 CUOTA:["La cuota del paso 2.5",
   `<p class="q"><b>Qué es:</b> los créditos que el paso anterior asignó a esta especialidad o competencia, según cuánta formación exige comparada con las demás.</p>
    <p>Es el presupuesto con el que usted arma sus cursos. No es un techo rígido, es la referencia: si sus cursos suman mucho más, alguien más se queda sin sus créditos, porque la bolsa del plan es fija.</p>
    <div class="analog"><b>Ejemplo.</b> Si la cuota es 29 créditos y sus cursos suman 26, faltan 3: o un curso quedó corto o una función se quedó sin curso. Si suman 33, hay 4 de más y saldrán del bolsillo de otra especialidad.</div>`],
 DESV:["La desviación",
   `<p class="q"><b>Qué es:</b> la diferencia entre lo que suman los cursos elegidos y la cuota del paso 2.5. En positivo sobran créditos; en negativo faltan.</p>
    <p>La tolerancia del método es <b>±1 crédito</b> para los cursos troncales, porque un curso compartido reparte sus créditos entre varias especialidades y el redondeo nunca cuadra exacto.</p>
    <div class="ko"><b>Si se pasa de ahí</b> no se cuadra a mano: o la familia de cursos está mal armada —un curso junta funciones que no van juntas— o el peso del 2.5 hay que revisarlo. Se declara y se corrige en su origen.</div>`],
 OFERTA:["Lo que cursa el estudiante y lo que dicta la escuela",
   `<p><b>EL</b> es un requisito de egreso: todo estudiante cursa esos créditos electivos, una sola vez, y entran al total del plan una vez.</p>
    <p><b>OFERTA</b> es lo que la escuela debe dictar para que cada itinerario baste por sí solo. Con seis especialidades y 12 créditos de requisito, el estudiante cuenta 12 y la escuela dicta 72. Esa es la cifra que la capacidad instalada tiene que sostener, y nunca suma al total del plan.</p>`]
};

 PF:["PF","navy","Cuánta formación exige, de 0 a 100"],DIST:["%","navy","El reparto de 100 puntos entre especialidades"],

 PD:["PD","navy","Cuánto reclaman las especialidades de cada dimensión"],ANCL:["⌖","navy","Al nivel más fino donde el saber se necesita"],NMIN:["≥","ok","Lo que el tronco enseña a todos"],CLAS:["◫","gold","De fundamento o de especialidad"],COOC:["∞","navy","Cómo se decide qué temas van juntos"],OBJ:["◎","ok","¿Actúan sobre el mismo objeto?"],NOMB:["Aa","gold","¿Un docente lo reconocería como algo que se enseña?"],MAPA:["◳","navy","Dos preguntas distintas en un solo gráfico"],CERT:["★","ok","Cuándo conviene una certificación progresiva"],CUOTA:["=","navy","Los créditos que el 2.5 asignó a esta unidad"],HITO:["N","ok","Hasta dónde llega el curso"],DESV:["±","bad","Cuánto se pasa o falta frente a esa cuota"]};
const ayuda = k => `<button class="infob" data-ay="${k}" aria-label="Qué significa">?</button>`;
function ayOpen(k){
  const a = AY[k]; if(!a) return; const x = AYX[k] || ["?","navy",""];
  openModal(a[0], `<div class="ayhero ay-${x[1]}"><span class="ayic">${esc(x[0])}</span><div><b>${esc(a[0])}</b><small>${esc(x[2])}</small></div></div>${a[1]}`);
}

/* ---------- vistas 2.4 ---------- */
function viewDisc(){
  const m = S.mode.disc;
  return `<div class="sheet">${seg("disc",[["lote","Lote de especialidades"],["temas","Temas nucleares",!S.d23.temas],["dim","Dimensiones",!S.d23.dim],["comp","Competencia disciplinar",!S.d23.comp],["band","Bandeja de competencias",!S.d23.comp]])}
  ${({lote:dLote,temas:dTemas,dim:dDim,comp:dComp,band:dBand})[m]()}</div>`;
}
/* --- compuerta: mismo diseño que la cartera de la Fase 1 --- */
function dLote(){
  const ok = S.d23.lote, res = S.d23.temas;
  const f1 = n => F1.esp.find(e=>e.n===n) || {PRI:"—",ATR:"—",VIA:"—",dec:"nucleo",desc:"",puesto:3,emprende:3};
  const sc = (v,c) => `<span class="sc"><b>${v}</b><i><em style="width:${v}%;background:${c}"></em></i></span>`;
  return `<div class="eyebrow">Paso 2.4 · M1 · Compuerta de lote</div>
  <h2>Cartera de especialidades · origen Fase 1</h2><div class="rule"></div>
  <p class="note">La misma cartera de la Fase 1, con lo que la Fase 2 ya produjo. El paso 2.4 es de <b>escuela</b> y necesita el lote completo, así que antes de empezar <b>verifica tres cosas</b> en cada especialidad: que su 2.2 esté cerrado, que su matriz traiga el <b>vínculo recurso–tarea</b> —sin él un tema no se puede anclar a la tarea que lo exige— y que todas vengan del mismo método. Si algo falta, el paso se detiene aquí y dice qué especialidad lo detuvo.</p>
  <div class="tw"><table class="tbl-esp" style="min-width:920px"><thead><tr>
    <th class="num" style="width:56px">Prior.</th><th style="min-width:200px">Especialidad</th>
    <th style="width:64px">Comp.</th><th class="num" style="width:62px">Potencial</th>
    <th style="width:150px">Estado en la Fase 2</th>
    <th class="num" style="width:96px">Temas de fundamento</th><th class="num" style="width:86px">fund(e)</th>
    <th style="width:120px">Dimensiones que la sirven</th></tr></thead><tbody>
  ${ESC.map(e=>{ const g=f1(e.n), fu=fundE(e.k), ds=[...new Set(tnEsp(e.k).filter(esFund).map(t=>t[6]))];
    return `<tr class="${e.real?"p1":""}">
      <td class="num"><span class="pri">${g.PRI}</span><span class="rk">${e.k}</span></td>
      <td class="nom" style="--acc:${F1.DEC[g.dec]?F1.DEC[g.dec].col:"#1d3a6b"}"><span class="f-nom">${esc(e.n)}</span>
        <span class="f-sub">${e.fn} funciones · ${e.real?'<b>datos reales</b>':"lote simulado"}</span></td>
      <td class="num">${e.c}</td><td class="num">${sc(e.pot,"#003366")}</td>
      <td><div class="bps"><span class="bp ok">2.1 cerrado</span><span class="bp ${ok||e.real?"ok":""}">${ok||e.real?"2.2 cerrado":"2.2 en curso"}</span><span class="bp ${ok||e.real?"ok":""}">vínculo</span></div></td>
      <td class="num">${res?`<b>${fu.f}</b> de ${fu.tot}`:"—"}</td>
      <td class="num">${res?sc(fu.pct,"#5B6470"):"—"}</td>
      <td>${res?`<div class="bps">${ds.sort().map(d=>`<span class="et v3" title="${esc(dimDe(d)?dimDe(d)[1]:d)}">${d}</span>`).join(" ")}</div>`:'<span class="mini">tras el barrido</span>'}</td></tr>`; }).join("")}

/* ---------- 2.5 Pesos y créditos ---------- */
const IND = {
  E1:{A:78,P:34,C:62,H:100}, E2:{A:66,P:22,C:40,H:28}, E3:{A:100,P:100,C:100,H:94},
  E4:{A:30,P:58,C:72,H:80},  E5:{A:0,P:66,C:18,H:44},  E6:{A:42,P:48,C:0,H:36}
};
const INDR = {
  E1:{a1:"10 fn · 32 tareas",p1:"EPA 3,4",c1:"C 2,8",h1:"Σ dominio 84"},
  E2:{a1:"9 fn · 28 tareas",p1:"EPA 3,1",c1:"C 2,4",h1:"Σ dominio 41"},
  E3:{a1:"12 fn · 58 tareas",p1:"EPA 4,2",c1:"C 3,7",h1:"Σ dominio 93"},
  E4:{a1:"6 fn · 19 tareas",p1:"EPA 3,6",c1:"C 3,0",h1:"Σ dominio 71"},
  E5:{a1:"5 fn · 14 tareas",p1:"EPA 3,8",c1:"C 2,1",h1:"Σ dominio 48"},
  E6:{a1:"7 fn · 21 tareas",p1:"EPA 3,5",c1:"C 1,8",h1:"Σ dominio 39"}
};
const AHPW = {A:.22,P:.37,C:.20,H:.21};
const AHPV = [["Y1 · Metodólogo curricular","0,20","0,36","0,22","0,22","0,03"],["Y4 · Docente formador","0,24","0,35","0,19","0,22","0,05"],
  ["Y5 · Metodólogo de medición","0,22","0,38","0,20","0,20","0,02"],["Y3 · Empleador","0,21","0,39","0,21","0,19","0,07"]];
S.d24 = {gen:false, ind:false, panel:false, pesos:false, corte:false, saved:false, crit:false, ESPEC:170, EL:12, CAP:44, modo:"incluido", ronda:1};
const PLAN = {elRatio:0.0706, total:()=>40+S.d24.ESPEC, FG:40, bESPEC:[160,180], bEL:[10,16], bFD:[30,45], pisoPct:8, techoPct:40, f:1.5};
const PF = k => { const i=IND[k]; return i.A*AHPW.A + i.P*AHPW.P + i.C*AHPW.C + i.H*AHPW.H; };
const sumPF = () => ESC.reduce((a,e)=>a+PF(e.k),0);
const distE = k => PF(k)/sumPF()*100;
const potN = k => { const s=ESC.reduce((a,e)=>a+e.pot,0); return ESC.find(e=>e.k===k).pot/s*100; };
const IPC = k => .70*PF(k) + .30*(ESC.find(e=>e.k===k).pot);
const ALIASE = {E1:"Servicios de alimentación",E2:"Nutrición comunitaria",E3:"Clínica y pediátrica",E4:"Productos alimentarios",E5:"Evaluación avanzada",E6:"Nutrición deportiva"};
const certOf = k => { const e=ESC.find(x=>x.k===k), ds=ESC.map(x=>distE(x.k)), ps=ESC.map(x=>x.pot);
  const mx=(Math.max(...ds)+Math.min(...ds))/2, my=(Math.max(...ps)+Math.min(...ps))/2;
  const alto=distE(k)>=mx, pot=e.pot>=my;
  return !alto&&pot ? ["Sí · prioritaria","t-ok","El mercado la pide más de lo que su peso justifica en obligatorios: certificación progresiva o itinerario electivo."]
    : alto&&pot ? ["Opcional","t-prop","Ya es núcleo del plan. La certificación solo añade señal de mercado sobre lo que el egresado igual llevará."]
    : alto&&!pot ? ["No conviene","t-neutral","Formación costosa que el mercado pide poco: certificarla no añade demanda."]
    : ["No","t-neutral","Ni exige formación intensa ni el mercado la reclama."]; };
function reparto(bolsa, pares){ // [k, %] → enteros por restos mayores
  const ex = pares.map(([k,p])=>[k, bolsa*p/100]);
  const ent = ex.map(([k,v])=>[k, Math.floor(v), v-Math.floor(v)]);
  let falta = bolsa - ent.reduce((a,x)=>a+x[1],0);
  ent.sort((a,b)=>b[2]-a[2]); for(let i=0;i<falta;i++) ent[i%ent.length][1]++;
  const o={}; ent.forEach(x=>o[x[0]]=x[1]); return o;
}
const CRD = {dim:{}, esp:{}, FD:0, CE:0, OBLIG:0, fracPond:0, itin:[], OFERTA:0};
function calc24(){
  CRD.fracPond = ESC.reduce((a,e)=>a + distE(e.k)*fundE(e.k).pct/100, 0)/100;
  CRD.FD = Math.round(S.d24.ESPEC * CRD.fracPond);
  CRD.CE = S.d24.ESPEC - CRD.FD;
  CRD.OBLIG = S.d24.modo==="incluido" ? CRD.CE - S.d24.EL : CRD.CE;
  const PD = S.d23.DIM.map(d=>[d[0], ESC.reduce((a,e)=>a + distE(e.k)*fracED(e.k,d[0]), 0)]);
  const sPD = PD.reduce((a,x)=>a+x[1],0);
  CRD.dimPct = {}; CRD.PD = {}; PD.forEach(x=>{ CRD.PD[x[0]]=x[1]; CRD.dimPct[x[0]] = x[1]/sPD*100; });
  CRD.dim = reparto(CRD.FD, PD.map(x=>[x[0], x[1]/sPD*100]));
  CRD.esp = reparto(CRD.OBLIG, ESC.map(e=>[e.k, distE(e.k)]));
  CRD.piso = Math.ceil(PLAN.pisoPct/100*CRD.OBLIG); CRD.techo = Math.floor(PLAN.techoPct/100*CRD.OBLIG);
  CRD.itin = ESC.filter(e=>potN(e.k) - distE(e.k) > 0).map(e=>[e.k, potN(e.k)-distE(e.k)]);
  CRD.OFERTA = Math.min(S.d24.CAP, Math.max(Math.round(PLAN.f*S.d24.EL), CRD.itin.length*S.d24.EL));
  const sd = CRD.itin.reduce((a,x)=>a+x[1],0), extra = CRD.OFERTA - CRD.itin.length*S.d24.EL;
  CRD.oferta = {}; CRD.itin.forEach(x=>CRD.oferta[x[0]] = S.d24.EL + Math.round(extra*x[1]/sd));
  CRD.fdPct = CRD.FD/S.d24.ESPEC*100;
  return CRD;
}

function abrirCuadrante(key){

function pComp(){

  const filas = [
    ...COMPE.map(x=>{ const es=ESC.filter(e=>e.c===x[0]); return {cod:x[0], nom:x[1], tipo:"Especialidad", cls:"hb",
      cr:es.reduce((a,e)=>a+c.esp[e.k],0), det:es.map(e=>`${e.k} · ${e.n} · ${c.esp[e.k]} cr`), n:es.length, un:"especialidades"}; }),
    ...S.d23.CD.map(x=>({cod:x[0], nom:x[4]||x[1], tipo:"Disciplinar", cls:"ct",
      cr:x[3].reduce((a,k)=>a+(c.dim[k]||0),0), det:x[3].map(k=>`${k} · ${dimDe(k)[1]} · ${c.dim[k]} cr`), n:x[3].length, un:"dimensiones"}))];

function vPropuesta(k){

  const ks = k[0]==="E" ? [k] : ESC.filter(e=>e.c===k).map(e=>e.k);
  return CUR.filter(c=> c[2]!=="dimension" && (ks.includes(c[3]) || (c[2]==="especialidad"&&(c[5]||[]).some(x=>ks.includes(x))) || c[2]==="practica"));

  const ks = ESC.filter(e=>e.c===k).map(e=>e.k), out=[], vis=new Set();
  ks.forEach(x=>(PLANV[x]||[]).forEach(c=>{ if(!vis.has(c[0])){ vis.add(c[0]); out.push(c); } }));

function vCuota(k){

function presu(){
  const c24 = calc24();
  const cupT = PL5.ciclos*PL5.tope, cupE = Math.ceil(S.d24.EL/PL5.techoCr), cupP = PL5.practica==="curso"?1:0;
  const disp = cupT - PL5.generales - cupP - cupE;
  const bolsa = c24.FD + c24.OBLIG, prom = bolsa/disp;
  const Nd = {}, Ne = {};
  S.d23.DIM.forEach(d=>Nd[d[0]] = Math.max(1, Math.round(c24.dim[d[0]]/prom)));
  ESC.forEach(e=>Ne[e.k] = Math.max(1, Math.round(c24.esp[e.k]/prom)));
  const cursa = PL5.generales + CUR.filter(c=>c[2]==="dimension"||c[2]==="especialidad"||c[2]==="practica").length + cupE;
  return {cupT, cupE, cupP, disp, bolsa, prom, Nd, Ne, cursa, porCiclo:cursa/PL5.ciclos, c24};
}

}

/* ---------- Detalle ---------- */
function prodToText(p){
  return `Producto: ${p.name}\n${p.desc}\n\nEntregables:\n` + p.ents.map(e=>`${e.n}. ${e.t} (${e.codes}): ${e.sum}\n${e.ev.map(v=>"- "+v).join("\n")}`).join("\n\n");
}
function textToProd(t, old){
  const L=t.split("\n"); const p={name:old.name, desc:"", ents:[]}; let mode="d";
  L.forEach(raw=>{ const l=raw.trim(); if(!l) return;
    let m;
    if((m=l.match(/^Producto:\s*(.*)$/i))){ p.name=m[1]; return; }
    if(/^Entregables:?$/i.test(l)){ mode="e"; return; }
    if(mode==="e" && (m=l.match(/^(\d+)\.\s*(.+?)(?:\s*\(([^)]*)\))?:\s*(.*)$/))){ p.ents.push({n:m[1],t:m[2],codes:m[3]||"",sum:m[4],ev:[]}); return; }
    if(mode==="e" && /^[-•◦]/.test(l) && p.ents.length){ p.ents[p.ents.length-1].ev.push(l.replace(/^[-•◦]\s*/,"")); return; }
    if(mode==="d") p.desc += (p.desc?" ":"")+l;
  });
  return p;
}
function openDrawer(code){
  const f = S.fn.find(x=>x.c===code); const dr=$("#drawer");
  const ro = false;
  const draft = {fn:`${f.t}\n${f.d}`, fd:f.fd, ji:f.ji, prod:prodToText(f.prod)};
  const presProd = pr => `<div class="ptitle">${esc(pr.name)}</div><p>${esc(pr.desc)}</p><div class="eyebrow" style="margin:8px 0 2px">Entregables</div>${pr.ents.map(e=>`<p style="margin:6px 0 0"><b>${e.n}. ${esc(e.t)}</b> <span class="num" style="font-size:11px;color:var(--ink-3)">${esc(e.codes)}</span>: ${esc(e.sum)}</p><ul>${e.ev.map(v=>`<li>${esc(v)}</li>`).join("")}</ul>`).join("")}`;
  const sec = (key,label,html) => `<div><div class="eyebrow">${label} ${ro?"":'<span class="edhint">· clic para editar</span>'}</div><div class="pres ${ro?"ro":""}" data-ek="${key}" tabindex="0">${html}</div></div>`;
  dr.innerHTML = `<div class="drag" title="Arrastre para ampliar"></div>
  <header><div><div class="eyebrow">Panel de mejora · ${esc(f.c)} · ${esc(f.tipo)} · Demanda ${esc(f.dem)} · Impacto ${esc(f.imp)} · ${esc(f.dec)}</div><h4>${esc(f.t)}</h4></div>
    <button class="btn sm" id="drWide">${dr.classList.contains("wide")?"⤡ Reducir":"⤢ Ampliar"}</button><button class="btn ghost sm" id="drClose" aria-label="Cerrar">✕</button></header>
  <div class="db"><div class="cols">
    <div style="display:grid;gap:14px;align-content:start">
      ${sec("fn","Función profesional (título y descripción)",`<div class="ptitle">${esc(f.c)} · ${esc(f.t)}</div><p>${esc(f.d)}</p>`)}
      ${sec("fd",`Fundamento de la demanda · ${esc(f.dem)}`,`<p>${esc(f.fd)}</p>`)}
      ${sec("ji",`Justificación del impacto · ${esc(f.imp)}`,`<p>${esc(f.ji)}</p>`)}
      <div><div class="eyebrow">Referencias</div><p>${refBtns(f.refs,"per")}</p></div>
    </div>
    <div style="display:grid;gap:14px;align-content:start">
      ${sec("prod","Producto, entregables y evidencias",presProd(f.prod))}
    </div>
  </div></div>
  <footer>
    <label class="eyebrow" for="drNote">Pedir un ajuste a Génesys</label>
    <textarea id="drNote" class="ed" rows="2" placeholder="Ej.: agrega evidencia regional de los hospitales de convenio"></textarea>
    <div class="frow">${S.saved.p21?'<span class="mini" style="margin-right:auto">Paso 2.1 guardado · los cambios quedan en el borrador</span>':'<span class="mini" id="drDirty" style="margin-right:auto"></span>'}<button class="btn" id="drAsk">Enviar ajuste</button>${ro?"":'<button class="btn primary" id="drSave" disabled>Guardar cambios</button>'}</div>
  </footer>`;
  dr.hidden=false;
  if(!ro) dr.querySelectorAll(".pres").forEach(el=>{
    const open=()=>{ if(el.querySelector("textarea")) return; const k=el.dataset.ek;
      el.innerHTML=`<textarea class="ta-ed" rows="${k==="prod"?20:k==="fn"?5:10}">${esc(draft[k])}</textarea>`; el.classList.add("ro");
      const t=el.querySelector("textarea"); t.focus();
      t.oninput=()=>{ draft[k]=t.value; const b=$("#drSave"); if(b) b.disabled=false; const dd=$("#drDirty"); if(dd) dd.textContent="Cambios sin guardar"; };
    };
    el.onclick=open; el.onkeydown=e=>{ if(e.key==="Enter"&&!el.querySelector("textarea")){ e.preventDefault(); open(); } };
  });
  $("#drClose").onclick=closeDrawer;
  $("#drWide").onclick=()=>{ dr.style.width=""; dr.classList.toggle("wide"); $("#drWide").textContent=dr.classList.contains("wide")?"⤡ Reducir":"⤢ Ampliar"; };
  dr.querySelector(".drag").onmousedown=ev=>{ ev.preventDefault(); const pr=dr.parentElement.getBoundingClientRect();
    const mv=e=>{ const w=Math.min(Math.max(380,pr.right-e.clientX),pr.width); dr.style.width=w+"px"; dr.classList.toggle("wide", w>820); };
    const up=()=>{ removeEventListener("mousemove",mv); removeEventListener("mouseup",up); };
    addEventListener("mousemove",mv); addEventListener("mouseup",up); };
  $("#drAsk").onclick=()=>{ const v=$("#drNote").value.trim(); if(!v) return; $("#drNote").value=""; $("#prompt").value=`${f.c}: ${v}`; send(); toast("Ajuste enviado a Génesys"); };
  const sv=$("#drSave"); if(sv) sv.onclick=()=>{
    const L=draft.fn.split("\n").filter(x=>x.trim()); if(L.length){ f.t=L[0].replace(/^[^·]*·\s*/,"").trim()||f.t; f.d=L.slice(1).join(" ").trim()||f.d; }
    f.fd=draft.fd; f.ji=draft.ji; f.prod=textToProd(draft.prod, f.prod);
    refresh(); openDrawer(code); toast(`${f.c}: cambios guardados${S.saved.p21?"; vuelva a guardar el paso 2.1 para versionarlos":S.delphi?"; si alteran el sentido, marque el bloque con ↺":""}`);
  };
}

function toggleExpand(force){
  const w=$("#work"); const on = force===undefined ? !w.classList.contains("expanded") : force;
  w.classList.toggle("expanded", on);
  try{ const el=document.querySelector(".panel");
    if(on && el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(()=>{});
    if(!on && document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  }catch(e){}
  $("#expandBtn").textContent = on ? "⤡ Restaurar" : "⤢ Expandir";
  $("#expandBtn").setAttribute("aria-pressed", on);
}
