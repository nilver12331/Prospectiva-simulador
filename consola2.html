<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diseño Curricular</title>
<meta name="description" content="Fase 2 del rediseño curricular: funciones, elementos de productividad, temas, pesos, créditos y cursos, conducidos por el mentor Génesys.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23003366'/><text x='32' y='43' font-size='34' text-anchor='middle' font-family='Segoe UI,Arial' font-weight='700' fill='%23C8961E'>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/fase2.css?v=2">
<link rel="stylesheet" href="css/fase2-tema.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/nube.js?v=4"></script>
</head>
<body class="f2">

<header class="top">
  <a class="marca-l" href="programas.html" data-volver-proyecto title="Volver al proyecto de evaluación"><span class="logo">M</span><span class="marca">Diseño Curricular</span></a>
  <label class="pick-f2" title="Cambiar de carrera"><span class="ic" id="pkIc">🎓</span><span><b id="crEsc">Escuela</b><em>Fase 2 · pasos 2.1 a 2.6</em></span><select id="selEsc" aria-label="Escuela profesional"></select></label>
  <div class="spacer"></div>
  <a class="b-top" href="programas.html" title="Gestión de programas curriculares">Programas</a>
  <a class="b-top" href="programas.html" data-volver-proyecto title="Volver al proyecto de evaluación">← Regresar</a>
  <span id="sesion"></span>
</header>

<main class="work" id="work">
  <!-- CHAT -->
  <section class="chat" aria-label="Conversación con Génesys">
    <div class="g-cab2">
      <div class="agent-head">
        <div class="avatar live"><img src="img/genesis.webp" alt="" decoding="async"></div>
        <div><h1>Mentor Curricular Génesys</h1><p id="agSpec">Especialidad: por elegir</p><button class="b-reinicio" id="bReinicio" title="Vuelve al inicio del paso de la especialidad en curso; otro clic, al momento cero de la carrera">↺ Reiniciar</button></div>
      </div>
      <button class="stepline" id="stepline" title="Ver progreso"></button>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="contbar" id="contbar"></div>
    <div class="composer">
      <div class="box">
        <textarea id="prompt" rows="1" placeholder="Da una instrucción a Génesys…"></textarea>
        <button class="send" id="sendBtn" aria-label="Enviar">↑</button>
      </div>
      <div class="hint"><span>Enter para enviar · Shift+Enter nueva línea</span><span>Mentor Génesys · método v6.3</span></div>
    </div>
  </section>

  <!-- PANEL -->
  <section class="panel" aria-label="Documento de trabajo">
    <div class="p-head">
      <div class="p-title"><label class="sr" for="docSel" hidden>Documento</label><select class="docsel" id="docSel"></select><small id="pSub" style="display:block">Fuente: Fase 1 aprobada</small></div>
      <button class="btn sm" id="homeBtn" title="Volver a la cartera de especialidades de la Fase 1">⌂ Cartera</button>
      <div class="navpair"><button class="btn sm" id="navPrev" title="Interfaz anterior">←</button><button class="btn sm" id="navNext" title="Interfaz siguiente">→</button></div>
      <button class="btn sm" id="dlBtn">Exportar Word</button>
      <button class="btn sm" id="expandBtn" aria-pressed="false">⤢ Expandir</button>
      <button class="btn sm railbtn" id="railBtn" aria-pressed="true" title="Progreso, salidas y contexto">◨ Panel</button>
    </div>

    <div class="p-body" id="pBody"></div>
    <aside class="drawer" id="drawer" hidden></aside>
  </section>

  <!-- RAIL -->
  <aside class="rail" id="rail" aria-label="Progreso, salidas y contexto">
    <div class="pu-cab"><span>Panel</span><button type="button" class="rail-close" id="railClose" aria-label="Ocultar el panel">››</button></div>
    <section class="rsec"><button aria-expanded="true" data-sec="p">Progreso · Fase 2 <span class="c" id="progCount">0/0</span></button><ol class="prog" id="railProg"></ol></section>
    <section class="rsec"><button aria-expanded="true" data-sec="o">Salidas <span class="c" id="outCount">1</span></button><ul class="outs" id="railOut"></ul></section>
    <section class="rsec"><button aria-expanded="true" data-sec="f">Fuentes consultadas por Génesys</button><ul class="outs" id="railSrc"></ul></section>
  </aside>
</main>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="mbox"><header><h4 class="mtitle"></h4><button class="btn ghost sm mclose" aria-label="Cerrar">✕</button></header><div class="mbody"></div></div></div>
<div class="toast" id="toast" hidden><span class="dot"></span><span id="toastTxt"></span></div>

<script src="datos/f2-nut.js?v=3"></script>
<script src="datos/f2-sis.js?v=3"></script>
<script src="js/f2.js?v=5"></script>
</body>
</html>
