<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingresar · Mentora</title>
<meta name="description" content="Ingreso al rediseño curricular de Mentora.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23003366'/><text x='32' y='43' font-size='34' text-anchor='middle' font-family='Segoe UI,Arial' font-weight='700' fill='%23C8961E'>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2b4f;--navy-2:#134c8c;--oro:#d4a12a;--tinta:#152238;--gris:#5b6b80;--linea:#dde4ee;--fondo:#eef2f7;--mal:#b3412f;--ease:cubic-bezier(.2,.7,.2,1)}
@view-transition{navigation:auto}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;color:var(--tinta);-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:24px 16px;
 background:linear-gradient(120deg,#0b2b4f 0%,#123f75 50%,#134c8c 100%);position:relative;overflow-x:hidden;isolation:isolate}
.orbe{position:fixed;border-radius:50%;filter:blur(60px);z-index:-1;opacity:.55}
.o1{width:520px;height:520px;right:-140px;top:-180px;background:rgba(212,161,42,.55);animation:vagar 16s ease-in-out infinite}
.o2{width:460px;height:460px;left:-160px;bottom:-200px;background:rgba(15,118,110,.7);animation:vagar 20s ease-in-out infinite reverse}
.rejilla{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;
 -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 30%,transparent 80%);animation:rejilla 30s linear infinite}
@keyframes vagar{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(-40px,30px,0) scale(1.08)}66%{transform:translate3d(30px,-20px,0) scale(.95)}}
@keyframes rejilla{to{background-position:44px 44px,44px 44px}}
@keyframes subir{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.caja{width:min(420px,100%);animation:subir .8s var(--ease) both}
.marca{display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;margin-bottom:22px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--oro);color:#0b2b4f;display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.marca b{font-size:17px}.marca span{font-weight:500;opacity:.75}
.tarjeta{position:relative;background:#fff;border-radius:20px;padding:30px 28px 26px;box-shadow:0 30px 70px -24px rgba(0,0,0,.5);overflow:hidden}
.tarjeta:before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:linear-gradient(90deg,#d4a12a,#3b82c4,#0f766e,#d4a12a);background-size:200% 100%;animation:barra 5s linear infinite}
@keyframes barra{to{background-position:-200% 0}}
h1{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}
.sub{margin:0 0 22px;color:var(--gris);font-size:14px;line-height:1.55;font-family:"Source Serif 4",Georgia,serif}
label{display:block;font-size:12px;font-weight:600;color:var(--gris);margin:0 0 6px}
.campo{margin-bottom:16px}
input{width:100%;font:inherit;font-size:14.5px;color:var(--tinta);border:1.5px solid var(--linea);border-radius:11px;padding:12px 14px;background:#f8fafc;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus{border-color:var(--navy-2);background:#fff;box-shadow:0 0 0 4px rgba(19,76,140,.14)}
.clave{position:relative}
.clave input{padding-right:78px}
.ver{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:inherit;font-size:12px;font-weight:600;color:var(--navy-2);background:none;border:0;padding:6px 8px;cursor:pointer;border-radius:7px}
.ver:hover{background:var(--fondo)}
button.entrar{position:relative;width:100%;margin-top:6px;font:inherit;font-weight:700;font-size:15px;color:#fff;background:var(--navy-2);border:0;border-radius:12px;padding:14px;cursor:pointer;overflow:hidden;
 box-shadow:0 8px 18px -6px rgba(19,76,140,.55);transition:transform .2s var(--ease),background .2s}
button.entrar:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);transition:transform .7s var(--ease)}
button.entrar:hover{transform:translateY(-2px);background:var(--navy)}
button.entrar:hover:before{transform:translateX(100%)}
button.entrar:disabled{opacity:.7;cursor:wait;transform:none}
.error{display:none;margin:0 0 14px;background:#f9e4e0;color:var(--mal);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45}
.error.on{display:block;animation:temblar .4s}
@keyframes temblar{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.nota{margin:18px 0 0;text-align:center;font-size:12.5px;color:var(--gris)}
.pie{margin-top:18px;text-align:center;font-size:11.5px;color:#b7c7da}
@media (prefers-reduced-motion:reduce){*,*:before{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/nube.js?v=2"></script>
</head>
<body>
<span class="orbe o1"></span><span class="orbe o2"></span><div class="rejilla"></div>
<main class="caja">
  <div class="marca"><span class="logo">M</span><div><b>Mentora</b> <span>· Gestión Curricular</span></div></div>
  <form class="tarjeta" id="f" novalidate>
    <h1>Ingresar</h1>
    <p class="sub">Use el correo y la contraseña que le dio el administrador del proyecto.</p>
    <p class="error" id="err" role="alert"></p>
    <div class="campo"><label for="correo">Correo</label><input id="correo" type="email" autocomplete="username" required autofocus></div>
    <div class="campo"><label for="clave">Contraseña</label>
      <div class="clave"><input id="clave" type="password" autocomplete="current-password" required><button type="button" class="ver" id="ver">Mostrar</button></div></div>
    <button class="entrar" id="b" type="submit">Ingresar</button>
    <p class="nota">¿No tiene acceso o olvidó su contraseña? Pídalo al administrador.</p>
  </form>
  <div class="pie">Metodología de Rediseño Curricular v6.3</div>
</main>
<script>
(function(){
 const q=new URLSearchParams(location.search).get("volver")||"";
 /* al iniciar sesión se entra a la gestión de programas; solo se vuelve a una consola o vista concreta si la sesión se cortó ahí */
 const destino=/^[\w-]+\.html(\?[\w=&%.-]*)?$/.test(q)&&!/^(index|ingreso)\.html/.test(q)?q:"programas.html";
 NUBE.listo.then(ok=>{ if(ok) location.replace(destino) });

 const f=document.getElementById("f"), err=document.getElementById("err"), b=document.getElementById("b"), clave=document.getElementById("clave");
 document.getElementById("ver").onclick=e=>{ const v=clave.type==="password"; clave.type=v?"text":"password"; e.target.textContent=v?"Ocultar":"Mostrar" };
 const mal=t=>{ err.textContent=t; err.classList.remove("on"); void err.offsetWidth; err.classList.add("on") };
 f.addEventListener("submit",async e=>{
  e.preventDefault();
  const correo=document.getElementById("correo").value.trim();
  if(!correo||!clave.value){ mal("Escriba su correo y su contraseña."); return }
  b.disabled=true; b.textContent="Ingresando…"; err.classList.remove("on");
  try{ await NUBE.ingresar(correo,clave.value); location.replace(destino) }
  catch(x){
   const m=(x&&x.message)||"";
   mal(/invalid login/i.test(m)?"Correo o contraseña incorrectos.":/confirm/i.test(m)?"El correo aún no está confirmado. Pida al administrador que lo confirme.":"No se pudo ingresar: "+m);
   b.disabled=false; b.textContent="Ingresar";
  }
 });
})();
</script>
</body>
</html>
